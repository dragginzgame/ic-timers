name: CI

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      failure_stage:
        description: 'Qualify failure artifacts (the selected jobs intentionally fail)'
        required: true
        type: choice
        default: early
        options:
          - early
          - late

jobs:
  msrv:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare failure evidence scratch
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/ic-timers-fixtures"
          printf 'TMPDIR=%s/ic-timers-fixtures\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Read canonical Rust policy
        id: rust-policy
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          make install-host-tools 2>&1 | tee "$RUNNER_TEMP/tools-install.log"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/read-rust-policy.sh >> "$GITHUB_ENV"
      - name: Prepare minimum Rust toolchain
        id: prepare-rust-minimum
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/dev/prepare-rust.sh "$IC_TIMERS_MSRV"
      - name: Pin cargo and rustc to MSRV
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TIMERS_MSRV" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare and check the complete toolset
        uses: ./.github/actions/prepare-common-tools
      - name: Check native and Wasm MSRV, provider visibility and nested probes
        run: |
          bash scripts/ci/test-repository-checks.sh
          make msrv testing-check
      - name: Collect Timers failure evidence
        id: collect-timers-evidence
        if: ${{ failure() }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/collect-failure-evidence.sh 2>&1 | tee "$RUNNER_TEMP/ic-timers-collection.log"
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-timers-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          prepared-archive: ${{ runner.temp }}/ic-timers-failure-evidence.tar.gz
          collection-log: ${{ runner.temp }}/ic-timers-collection.log

  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
      - name: Prepare failure evidence scratch
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/ic-timers-fixtures"
          printf 'TMPDIR=%s/ic-timers-fixtures\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Qualify early failure evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_stage == 'early' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/qualify-failure-evidence.sh early
      - name: Read canonical Rust policy
        id: rust-policy
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          make install-host-tools 2>&1 | tee "$RUNNER_TEMP/tools-install.log"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/read-rust-policy.sh >> "$GITHUB_ENV"
      - name: Prepare development Rust toolchain
        id: prepare-rust-development
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/dev/prepare-rust.sh "$IC_TIMERS_INTERNAL_TOOLCHAIN"
      - name: Pin cargo and rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TIMERS_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare and check the complete toolset
        uses: ./.github/actions/prepare-common-tools
      - name: Run CI gate
        id: ci-gate
        run: |
          make fetch
          make ci
      - name: Lint unpublished probes with internal toolchain
        run: make testing-check MSRV="$IC_TIMERS_INTERNAL_TOOLCHAIN"
      - name: Qualify native PocketIC recovery and policy cohorts
        run: make pocketic-watchdog pocketic-cohorts MSRV="$IC_TIMERS_INTERNAL_TOOLCHAIN"
      - name: Retain successful cohort receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timer-cohorts-${{ runner.os }}-${{ runner.arch }}-${{ env.IC_TIMERS_INTERNAL_TOOLCHAIN }}-${{ github.sha }}-${{ github.run_attempt }}
          path: testing/target/cohorts.json
          if-no-files-found: error
          retention-days: 14
      - name: Qualify late failure evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_stage == 'late' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/qualify-failure-evidence.sh late
      - name: Collect Timers failure evidence
        id: collect-timers-evidence
        if: ${{ failure() }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/collect-failure-evidence.sh 2>&1 | tee "$RUNNER_TEMP/ic-timers-collection.log"
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-timers-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          prepared-archive: ${{ runner.temp }}/ic-timers-failure-evidence.tar.gz
          collection-log: ${{ runner.temp }}/ic-timers-collection.log

  macos:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare failure evidence scratch
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/ic-timers-fixtures"
          printf 'TMPDIR=%s/ic-timers-fixtures\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Select native Bash and verify the declared host
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          host_os="$(uname -s)"
          host_arch="$(uname -m)"
          host_version="$(sw_vers -productVersion)"
          [[ "$host_os" == Darwin ]] || exit 1
          [[ "$host_arch" == "$EXPECTED_ARCHITECTURE" ]] || exit 1
          [[ "$host_version" == 15.* ]] || exit 1
          [[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == 3.2 ]] || exit 1
          # Every env-bash wrapper and Make recipe exercises Apple's Bash 3.2.
          echo /bin >> "$GITHUB_PATH"
      - name: Qualify early failure evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_stage == 'early' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/qualify-failure-evidence.sh early
      - name: Read canonical Rust policy
        id: rust-policy
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          make install-host-tools 2>&1 | tee "$RUNNER_TEMP/tools-install.log"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/read-rust-policy.sh >> "$GITHUB_ENV"
      - name: Prepare minimum Rust toolchain
        id: prepare-rust-minimum
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/dev/prepare-rust.sh "$IC_TIMERS_MSRV"
      - name: Prepare development Rust toolchain
        id: prepare-rust-development
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/dev/prepare-rust.sh "$IC_TIMERS_INTERNAL_TOOLCHAIN"
      - name: Pin cargo and rustc to internal toolchain
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: echo "RUSTUP_TOOLCHAIN=$IC_TIMERS_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare and check the complete toolset
        uses: ./.github/actions/prepare-common-tools
      - name: Run the complete native release gate
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: make release-verify
      - name: Retain successful cohort receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timer-cohorts-${{ runner.os }}-${{ runner.arch }}-${{ env.IC_TIMERS_MSRV }}-${{ github.sha }}-${{ github.run_attempt }}
          path: testing/target/cohorts.json
          if-no-files-found: error
          retention-days: 14
      - name: Qualify late failure evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_stage == 'late' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/qualify-failure-evidence.sh late
      - name: Collect Timers failure evidence
        id: collect-timers-evidence
        if: ${{ failure() }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/collect-failure-evidence.sh 2>&1 | tee "$RUNNER_TEMP/ic-timers-collection.log"
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-timers-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          prepared-archive: ${{ runner.temp }}/ic-timers-failure-evidence.tar.gz
          collection-log: ${{ runner.temp }}/ic-timers-collection.log

  # Inspect bytes downloaded from the existing failure uploader. The original
  # jobs retain their failure; this separate manual-only job supplies acceptance
  # evidence and refuses setup outages, stale identities and missing payloads.
  failure-evidence:
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [checks, macos]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: checks
            os: Linux
            arch: X64
          - job: macos
            os: macOS
            arch: X64
          - job: macos
            os: macOS
            arch: ARM64
    steps:
      - name: Require the original job to remain failed
        env:
          ORIGINAL_RESULT: ${{ needs[matrix.job].result }}
        run: test "$ORIGINAL_RESULT" = failure
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check evidence rejection cases
        run: python3 scripts/ci/test_failure_evidence.py
      - name: Download the original failed-job artifact
        # actions/download-artifact v8, as qualified by Shared Tooling 0.1.20
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ic-timers-failure-${{ matrix.job }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded-failure-evidence
      - name: Verify downloaded source identity, status, bytes and modes
        env:
          FAILURE_STAGE: ${{ inputs.failure_stage }}
          ORIGINAL_JOB: ${{ matrix.job }}
          ORIGINAL_HOST: ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          python3 scripts/ci/verify_failure_evidence.py \
            "$RUNNER_TEMP/downloaded-failure-evidence/ic-timers-failure-evidence.tar.gz" \
            "$FAILURE_STAGE" "$ORIGINAL_JOB" "$ORIGINAL_HOST"

  # PR/main owns full validation. A tag at the same main commit only rechecks
  # package metadata and tag identity, avoiding duplicate Rust builds while still
  # rejecting an independently pushed tag from an unmerged commit.
  tag-truth:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare failure evidence scratch
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/ic-timers-fixtures"
          printf 'TMPDIR=%s/ic-timers-fixtures\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Read canonical Rust policy
        id: rust-policy
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          make install-host-tools 2>&1 | tee "$RUNNER_TEMP/tools-install.log"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/read-rust-policy.sh >> "$GITHUB_ENV"
      - name: Prepare development Rust toolchain
        id: prepare-rust-development
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/dev/prepare-rust-toolchain.sh "$IC_TIMERS_INTERNAL_TOOLCHAIN" --component rustfmt
      - name: Verify release tag
        id: release-tag
        shell: bash
        run: |
          # The shared version reader needs the explicitly prepared parsers.
          make install-host-tools 2>&1 | tee "$RUNNER_TEMP/tools-install.log"
          make host-tools-check 2>&1 | tee "$RUNNER_TEMP/tools-check.log"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          expected_tag="v$(make --no-print-directory version)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "error: event tag $GITHUB_REF_NAME does not match $expected_tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: release tag commit is not reachable from main" >&2
            exit 1
          fi
          make release-tag-check
          # Inspect actual adopted payloads; regression fixtures stay in PR/main.
          bash scripts/ci/verify-shared-tooling-snapshot.sh
          make fetch
          RELEASE_COMMIT='' bash scripts/ci/cargo-release-metadata.sh check-graph ic-timers
      - name: Collect Timers failure evidence
        id: collect-timers-evidence
        if: ${{ failure() }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: bash scripts/ci/collect-failure-evidence.sh 2>&1 | tee "$RUNNER_TEMP/ic-timers-collection.log"
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-timers-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          prepared-archive: ${{ runner.temp }}/ic-timers-failure-evidence.tar.gz
          collection-log: ${{ runner.temp }}/ic-timers-collection.log
