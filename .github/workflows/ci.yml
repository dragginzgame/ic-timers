name: CI

env:
  IC_TIMERS_MSRV: 1.88.0
  IC_TIMERS_INTERNAL_TOOLCHAIN: 1.99.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  msrv:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare regression fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.IC_TIMERS_MSRV }}
          components: clippy, rustfmt
      - name: Pin cargo and rustc to MSRV
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TIMERS_MSRV" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare the pinned formatter and tool bundles
        run: |
          source tool-versions.env
          cargo install cargo-sort --version "$IC_TIMERS_CARGO_SORT_VERSION" --locked
          make install-tools
          make tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Check MSRV, provider visibility and nested probes
        run: |
          bash scripts/ci/test-repository-checks.sh
          make msrv testing-check

  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
      - name: Prepare regression fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.IC_TIMERS_INTERNAL_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Pin cargo and rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TIMERS_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare the pinned formatter and tool bundles
        run: |
          source tool-versions.env
          cargo install cargo-sort --version "$IC_TIMERS_CARGO_SORT_VERSION" --locked
          make install-tools
          make tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Run CI gate
        run: make ci
      - name: Lint nested probes with internal toolchain
        run: make testing-check MSRV="$IC_TIMERS_INTERNAL_TOOLCHAIN"

  macos:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select native Bash and verify the declared host
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          host_os="$(uname -s)"
          host_arch="$(uname -m)"
          host_version="$(sw_vers -productVersion)"
          [[ "$host_os" == Darwin ]]
          [[ "$host_arch" == "$EXPECTED_ARCHITECTURE" ]]
          [[ "$host_version" == 15.* ]]
          [[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == 3.2 ]]
          # Every env-bash wrapper and Make recipe exercises Apple's Bash 3.2.
          echo /bin >> "$GITHUB_PATH"
      - name: Prepare regression fixture prerequisites
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          command -v rg
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.IC_TIMERS_MSRV }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.IC_TIMERS_INTERNAL_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Pin cargo and rustc to internal toolchain
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: echo "RUSTUP_TOOLCHAIN=$IC_TIMERS_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare the pinned formatter and tool bundles
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          source tool-versions.env
          cargo install cargo-sort --version "$IC_TIMERS_CARGO_SORT_VERSION" --locked
          make install-tools
          make tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          echo "POCKET_IC_BIN=$GITHUB_WORKSPACE/.tools/ic/bin/pocket-ic" >> "$GITHUB_ENV"
      - name: Run the complete native release gate
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: make release-verify

  # PR/main owns full validation. A tag at the same main commit only rechecks
  # package metadata and tag identity, avoiding duplicate Rust builds while still
  # rejecting an independently pushed tag from an unmerged commit.
  tag-truth:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare regression fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.IC_TIMERS_INTERNAL_TOOLCHAIN }}
          components: rustfmt
      - name: Verify release tag
        shell: bash
        run: |
          # The shared version reader needs the explicitly prepared parsers.
          make install-tools
          make tools-check
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$GITHUB_WORKSPACE/.tools/ic/bin:$PATH"
          expected_tag="v$(make --no-print-directory version)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "error: event tag $GITHUB_REF_NAME does not match $expected_tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: release tag commit is not reachable from main" >&2
            exit 1
          fi
          make release-tag-check
          make fetch
          bash scripts/release/check-lockfiles.sh
          source tool-versions.env
          cargo install cargo-sort --version "$IC_TIMERS_CARGO_SORT_VERSION" --locked
          make release-check
