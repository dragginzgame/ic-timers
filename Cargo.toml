[workspace]
members = [
    # Production packages
    "crates/ic-timers",
    # Tests and tooling packages
    "testing/crates/ic-timers-pocketic",
    "testing/crates/ic-timers-runtime-probe",
    "testing/crates/ic-timers-size-probe",
    "testing/crates/ic-timers-test-protocol",
]
default-members = ["crates/ic-timers"]
resolver = "3"

[workspace.package]
rust-version = "1.91.0"
edition = "2024"
version = "0.29.6"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Observable and recovery-aware timers for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-timers"
homepage = "https://github.com/dragginzgame/ic-timers"
documentation = "https://docs.rs/ic-timers"
keywords = ["internet-computer", "canister", "timer", "dfinity", "icp"]
categories = ["asynchronous", "wasm"]

# Groups describe use by this workspace's packages; members inherit with `workspace = true`.
[workspace.dependencies]
# Production dependencies
ic-metrics = "0.14"
ic-platform = { version = "0.5", default-features = false }
# Already production-transitive through Platform's Principal; probes inherit this entry.
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Tests and tooling only
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-build = "0.62"
ic-host-artifacts = "0.62"
ic-host-process = "0.62"
ic-testkit = "0.62"
ic-timers = { path = "crates/ic-timers" }
ic-timers-test-protocol = { path = "testing/crates/ic-timers-test-protocol" }
ic-wire = "0.5"
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
doc_markdown = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

# Preserve the former testing workspace's canister optimization settings without
# changing the library workspace's ordinary release profile.
[profile.timer-probe]
inherits = "release"
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
