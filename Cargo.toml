[workspace]
members = [
    "crates/ic-timers",
    "testing/crates/ic-timers-pocketic",
    "testing/crates/ic-timers-runtime-probe",
    "testing/crates/ic-timers-size-probe",
]
default-members = ["crates/ic-timers"]
resolver = "3"

[workspace.package]
rust-version = "1.88.0"
edition = "2024"
version = "0.14.17"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Observable and recovery-aware timers for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-timers"
homepage = "https://github.com/dragginzgame/ic-timers"
documentation = "https://docs.rs/ic-timers"
keywords = ["internet-computer", "canister", "timer", "dfinity", "icp"]
categories = ["asynchronous", "wasm"]

[workspace.dependencies]
candid = "0.10"
ic-cdk = "=0.20.3"
ic-cdk-timers = "=1.0.0"
ic-metrics = "0.2"
ic-testkit = "0.24"
ic-timers = { path = "crates/ic-timers" }
ic0 = "=1.2.0"
serde = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
doc_markdown = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

# Preserve the former testing workspace's canister optimization settings without
# changing the library workspace's ordinary release profile.
[profile.timer-probe]
inherits = "release"
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
