[workspace]
members = ["crates/ic-timers"]
resolver = "2"

[workspace.package]
rust-version = "1.88.0"
edition = "2024"
version = "0.3.5"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Observable and recovery-aware timers for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-timers"
homepage = "https://github.com/dragginzgame/ic-timers"
documentation = "https://docs.rs/ic-timers"
keywords = ["internet-computer", "canister", "timer", "dfinity", "icp"]
categories = ["asynchronous", "wasm"]

[workspace.dependencies]
ic-cdk-timers = "=1.0.0"
ic0 = "=1.1.0"
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
doc_markdown = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
