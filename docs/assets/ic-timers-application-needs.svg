<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">How IC Timers meets application needs</title>
  <desc id="desc">Run something later: schedule a one-time task. Repeat background work: schedule another run after completion. Recover from failed work: use Watchdog to preserve another attempt. Coordinate several components: keep their timers in one shared inventory. Diagnose problems: report timer state, outcomes and resource observations.</desc>
  <rect width="1280" height="760" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · APPLICATION NEEDS</text>
    <text x="56" y="107" font-size="34" font-weight="700">What can IC Timers help with?</text>
    <text x="56" y="143" font-size="19" fill="#53718F">Match an application need to a scheduling capability.</text>

    <rect x="56" y="182" width="1168" height="520" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <path d="M74 182H1206Q1224 182 1224 200V252H56V200Q56 182 74 182Z" fill="#102B50"/>
    <text x="82" y="226" font-size="20" font-weight="700" fill="white">If your application needs to…</text>
    <text x="622" y="226" font-size="20" font-weight="700" fill="white">IC Timers can…</text>
    <path d="M56 342H1224M56 432H1224M56 522H1224M56 612H1224" stroke="#E3EBF3" stroke-width="1.5"/>
    <path d="M594 252V702" stroke="#E3EBF3" stroke-width="1.5"/>

    <g fill="#087C94">
      <circle cx="88" cy="297" r="4"/>
      <circle cx="88" cy="387" r="4"/>
      <circle cx="88" cy="477" r="4"/>
      <circle cx="88" cy="567" r="4"/>
      <circle cx="88" cy="657" r="4"/>
    </g>
    <g font-size="21">
      <text x="108" y="305">Run something later</text>
      <text x="108" y="395">Repeat background work</text>
      <text x="108" y="485">Recover from failed work</text>
      <text x="108" y="575">Coordinate several components</text>
      <text x="108" y="665">Diagnose problems</text>

      <text x="622" y="305">Schedule a one-time task</text>
      <text x="622" y="395">Schedule another run after completion</text>
      <text x="622" y="469">Use <tspan font-weight="700" fill="#20765E">Watchdog</tspan> to preserve</text>
      <text x="622" y="501">another attempt</text>
      <text x="622" y="559">Keep their timers in one</text>
      <text x="622" y="591">shared inventory</text>
      <text x="622" y="649">Report timer state, outcomes,</text>
      <text x="622" y="681">and resource observations</text>
    </g>
  </g>
</svg>
