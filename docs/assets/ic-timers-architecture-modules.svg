<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">IC Timers architecture module map</title>
<desc id="desc">The schedule, snapshot and control modules connect to the canonical registry. The runtime uses the registry and coordinates callbacks and effects. The private platform boundary sits below the runtime and is the only layer that talks directly to ic-cdk-timers. Connections show module relationships, not an execution sequence.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
</defs>
<rect width="1400" height="1080" fill="#F7FAFD"/>
<g font-family="Inter, Arial, sans-serif" fill="#102B50">
  <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · ARCHITECTURE</text>
  <text x="56" y="107" font-size="34" font-weight="700">One registry. A coordinated runtime.</text>
  <text x="56" y="143" font-size="19" fill="#53718F">A map of the six modules and their responsibilities.</text>

  <rect x="80" y="182" width="1240" height="788" rx="22" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
  <text x="112" y="220" font-size="14" font-weight="700" letter-spacing="1.5" fill="#53718F">IC TIMERS</text>

  <g fill="#F0FBFD" stroke="#009DBD" stroke-width="1.5">
    <rect x="176" y="248" width="288" height="92" rx="16"/>
    <rect x="556" y="248" width="288" height="92" rx="16"/>
    <rect x="936" y="248" width="288" height="92" rx="16"/>
  </g>
  <g font-family="Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle" fill="#087C94">
    <text x="320" y="303">schedule</text>
    <text x="700" y="303">snapshot</text>
    <text x="1080" y="303">control</text>
  </g>

  <path d="M320 342V378H1080V342M700 342V408" fill="none" stroke="#71859A" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="700" cy="378" r="5" fill="#71859A"/>

  <rect x="410" y="410" width="580" height="106" rx="16" fill="#F5F1FD" stroke="#7354C6" stroke-width="2"/>
  <text x="700" y="454" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700">registry</text>
  <text x="700" y="491" text-anchor="middle" font-size="20" fill="#53718F">Canonical timer state and registrations</text>
  <path d="M700 533V566" fill="none" stroke="#71859A" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="470" y="584" width="460" height="124" rx="18" fill="#102B50"/>
  <text x="700" y="631" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="white">runtime</text>
  <text x="700" y="668" text-anchor="middle" font-size="21" fill="#B5C8DD">Coordinates callbacks and effects</text>

  <rect x="136" y="610" width="244" height="72" rx="14" fill="#EDF3F9" stroke="#B8CBDF" stroke-width="1.5"/>
  <text x="258" y="655" text-anchor="middle" font-size="23" font-weight="600">Callbacks</text>
  <path d="M454 646H398" fill="none" stroke="#71859A" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="1020" y="610" width="244" height="72" rx="14" fill="#EDF3F9" stroke="#B8CBDF" stroke-width="1.5"/>
  <text x="1142" y="655" text-anchor="middle" font-size="23" font-weight="600">Effects</text>
  <path d="M947 646H1003" fill="none" stroke="#71859A" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <path d="M700 726V765" fill="none" stroke="#71859A" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="350" y="784" width="700" height="148" rx="18" fill="#EDF3F9" stroke="#B8CBDF" stroke-width="1.5"/>
  <text x="382" y="829" font-family="Consolas, monospace" font-size="28" font-weight="700">platform</text>
  <rect x="914" y="802" width="108" height="30" rx="15" fill="#EEE8FB"/>
  <text x="968" y="823" text-anchor="middle" font-size="14" font-weight="700" fill="#7354C6">PRIVATE</text>
  <text x="382" y="868" font-size="20" fill="#53718F">The only boundary that talks directly to</text>
  <text x="382" y="903" font-family="Consolas, monospace" font-size="22" fill="#087C94">ic-cdk-timers</text>

  <text x="700" y="1021" text-anchor="middle" font-size="17" fill="#53718F">Connections show module relationships, not an execution sequence.</text>
</g>
</svg>
