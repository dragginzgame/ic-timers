<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1320" viewBox="0 0 1280 1320" role="img" aria-labelledby="title desc">
  <title id="title">IC Timers runtime ownership and control flow</title>
  <desc id="desc">The application owns durable needs, outcomes and the upgrade lifecycle. A registration capability controls one named timer; it does not store that timer. IC Timers owns volatile runtime state: the runtime runs callbacks and coordinates scheduling; the canonical registry holds timer names, states, counters, callbacks and handles. Its private platform boundary is the only layer that talks directly to ic-cdk-timers. Timers are reconstructed from application state after an upgrade.</desc>
  <defs>
    <marker id="application-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#009DBD"/></marker>
    <marker id="runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7354C6"/></marker>
  </defs>
  <rect width="1280" height="1320" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · RUNTIME OWNERSHIP</text>
    <text x="56" y="107" font-size="34" font-weight="700">Durable application state. Volatile timers.</text>
    <text x="56" y="143" font-size="19" fill="#53718F">Ownership and control flow, from the application to the platform.</text>

    <rect x="100" y="182" width="1080" height="300" rx="22" fill="#F0FBFD" stroke="#009DBD" stroke-width="2"/>
    <text x="132" y="223" font-size="15" font-weight="700" letter-spacing="1.5" fill="#087C94">APPLICATION OWNS</text>
    <rect x="954" y="201" width="194" height="33" rx="16.5" fill="#DDF6FA"/>
    <text x="1051" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#087C94">Durable state</text>
    <rect x="252" y="253" width="776" height="82" rx="14" fill="white" stroke="#A2DCE5" stroke-width="1.5"/>
    <text x="640" y="304" text-anchor="middle" font-size="24" font-weight="700">Durable needs, outcomes, and upgrade lifecycle</text>
    <path d="M640 337V364" fill="none" stroke="#009DBD" stroke-width="2.5" marker-end="url(#application-arrow)"/>
    <rect x="252" y="380" width="776" height="78" rx="14" fill="white" stroke="#A2DCE5" stroke-width="1.5"/>
    <text x="280" y="412" font-size="23" font-weight="700">Registration capability</text>
    <text x="280" y="440" font-size="18" fill="#53718F">Controls one named timer — does not store it</text>

    <rect x="657" y="503" width="198" height="30" rx="15" fill="#F7FAFD"/>
    <text x="672" y="524" font-size="16" fill="#53718F">Controls one timer</text>

    <rect x="100" y="548" width="1080" height="554" rx="22" fill="#F5F1FD" stroke="#7354C6" stroke-width="2"/>
    <text x="132" y="589" font-size="15" font-weight="700" letter-spacing="1.5" fill="#7354C6">IC TIMERS OWNS</text>
    <rect x="954" y="567" width="194" height="33" rx="16.5" fill="#EEE8FB"/>
    <text x="1051" y="590" text-anchor="middle" font-size="16" font-weight="700" fill="#7354C6">Volatile state</text>
    <path d="M640 460V604" fill="none" stroke="#009DBD" stroke-width="2.5" marker-end="url(#application-arrow)"/>

    <rect x="252" y="620" width="776" height="96" rx="14" fill="white" stroke="#C6B7E8" stroke-width="1.5"/>
    <text x="280" y="658" font-size="25" font-weight="700">Runtime</text>
    <text x="280" y="691" font-size="20" fill="#53718F">Runs callbacks and coordinates scheduling</text>
    <path d="M640 718V755" fill="none" stroke="#7354C6" stroke-width="2.5" marker-end="url(#runtime-arrow)"/>

    <rect x="252" y="771" width="776" height="96" rx="14" fill="white" stroke="#C6B7E8" stroke-width="1.5"/>
    <text x="280" y="809" font-size="25" font-weight="700">Canonical registry</text>
    <text x="280" y="842" font-size="20" fill="#53718F">Timer names, states, counters, callbacks, and handles</text>
    <path d="M640 869V906" fill="none" stroke="#7354C6" stroke-width="2.5" marker-end="url(#runtime-arrow)"/>

    <rect x="252" y="922" width="776" height="148" rx="14" fill="#102B50"/>
    <text x="280" y="962" font-size="24" font-weight="700" fill="white">Private platform boundary</text>
    <rect x="909" y="940" width="94" height="29" rx="14.5" fill="#294768"/>
    <text x="956" y="960" text-anchor="middle" font-size="14" font-weight="700" fill="#D1C5F4">PRIVATE</text>
    <text x="280" y="1001" font-size="20" fill="#DCE6F1">The only layer that talks directly to</text>
    <text x="280" y="1035" font-size="21" font-family="Consolas, monospace" fill="#5CD7EA">ic-cdk-timers</text>

    <rect x="100" y="1146" width="1080" height="94" rx="16" fill="#EDF3F9" stroke="#D7E3EF" stroke-width="1.5"/>
    <text x="640" y="1201" text-anchor="middle" font-size="22" font-weight="600">Timers are reconstructed from application state after an upgrade.</text>
  </g>
</svg>
