<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">IC Timers Watchdog: a prepared attempt remains after work fails</title>
<desc id="desc">First, the scheduler prepares the next attempt. Second, it queues work. Third, the work fails. Fourth, the prepared attempt remains. The prepared attempt is shown separately from the failed work; this sequence does not promise that the next attempt succeeds.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
</defs>
<rect width="1440" height="790" fill="#F7FAFD"/>
<g font-family="Inter, Arial, sans-serif" fill="#102B50">
  <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · WATCHDOG FAILURE SEQUENCE</text>
  <text x="56" y="107" font-size="34" font-weight="700">Failed work does not erase the prepared attempt.</text>
  <text x="56" y="143" font-size="19" fill="#53718F">Watchdog prepares another attempt before queueing the work.</text>

  <rect x="56" y="182" width="1328" height="550" rx="22" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
  <text x="88" y="227" font-size="13" font-weight="700" letter-spacing="1.5" fill="#71859A">EVENT SEQUENCE</text>

  <circle cx="235" cy="271" r="19" fill="#DDF6FA"/><text x="235" y="278" font-size="19" font-weight="700" text-anchor="middle" fill="#087C94">1</text>
  <circle cx="563" cy="271" r="19" fill="#EDF3F9"/><text x="563" y="278" font-size="19" font-weight="700" text-anchor="middle" fill="#53718F">2</text>
  <circle cx="890" cy="271" r="19" fill="#FFF4F1"/><text x="890" y="278" font-size="19" font-weight="700" text-anchor="middle" fill="#A23B2F">3</text>
  <circle cx="1218" cy="271" r="19" fill="#E1F3EC"/><text x="1218" y="278" font-size="19" font-weight="700" text-anchor="middle" fill="#20765E">4</text>

  <rect x="88" y="304" width="294" height="120" rx="16" fill="#F0FBFD" stroke="#009DBD" stroke-width="1.5"/>
  <rect x="428" y="304" width="270" height="120" rx="16" fill="#EDF3F9" stroke="#B8CBDF" stroke-width="1.5"/>
  <rect x="754" y="304" width="272" height="120" rx="16" fill="#FFF4F1" stroke="#EDB6AD" stroke-width="1.5"/>
  <rect x="1082" y="304" width="272" height="120" rx="16" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>

  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="235" y="344">Scheduler prepares</text><text x="235" y="375">next attempt</text>
    <text x="563" y="373">Queues work</text>
    <text x="890" y="373" fill="#A23B2F">Work fails</text>
    <text x="1218" y="344" fill="#20765E">Prepared attempt</text><text x="1218" y="375" fill="#20765E">remains</text>
  </g>
  <path d="M394 364H412M710 364H738M1038 364H1066" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M235 426V518" fill="none" stroke="#218B70" stroke-width="2.5"/>
  <path d="M1218 426V518" fill="none" stroke="#218B70" stroke-width="2.5"/>
  <rect x="88" y="519" width="1266" height="136" rx="18" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
  <g transform="translate(122 547)" fill="none" stroke="#20765E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 0L44 9V29C44 43 34 53 24 59C14 53 4 43 4 29V9Z"/>
    <path d="M14 29L22 37L35 21"/>
  </g>
  <text x="198" y="566" font-size="24" font-weight="700" fill="#20765E">Next attempt already prepared</text>
  <text x="198" y="603" font-size="20" fill="#53718F">It remains in place when the queued work fails.</text>

  <path d="M890 426V491" fill="none" stroke="#C64535" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M884 485L896 497M896 485L884 497" stroke="#C64535" stroke-width="2.5" stroke-linecap="round"/>
  <text x="721" y="698" font-size="18" text-anchor="middle" fill="#53718F">The safety property is a preserved attempt, not a guaranteed successful outcome.</text>
</g>
</svg>
