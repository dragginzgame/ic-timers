<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">IC Timers scheduling modes</title>
  <desc id="desc">Once: run a task one time. After completion: run it again only after the previous run finishes successfully. Watchdog: prepare another attempt before starting important work, so a failed attempt does not silently stop the schedule.</desc>
  <rect width="1200" height="670" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · SCHEDULING MODES</text>
    <text x="56" y="107" font-size="34" font-weight="700">Choose how a task runs</text>
    <text x="56" y="143" font-size="19" fill="#53718F">Three modes, explained in plain language.</text>

    <rect x="56" y="182" width="1088" height="430" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <path d="M74 182H1126Q1144 182 1144 200V252H56V200Q56 182 74 182Z" fill="#102B50"/>
    <text x="82" y="226" font-size="19" font-weight="700" fill="white">Mode</text>
    <text x="394" y="226" font-size="19" font-weight="700" fill="white">Plain-language purpose</text>
    <path d="M56 346H1144M56 460H1144" stroke="#E3EBF3" stroke-width="1.5"/>
    <path d="M366 252V612" stroke="#E3EBF3" stroke-width="1.5"/>

    <rect x="82" y="279" width="40" height="40" rx="10" fill="#DDF6FA"/>
    <g fill="none" stroke="#087C94" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="102" cy="299" r="12"/>
      <path d="M102 292V299L108 303"/>
    </g>
    <text x="140" y="307" font-size="23" font-weight="700">Once</text>
    <text x="394" y="307" font-size="21">Run a task one time</text>

    <rect x="82" y="383" width="40" height="40" rx="10" fill="#EEE8FB"/>
    <g fill="none" stroke="#7354C6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M91 398C94 388 110 388 114 399M108 395L114 400L117 393M113 408C109 417 94 417 90 406M96 410L90 405L87 412"/>
      <path d="M98 402L101 405L107 399"/>
    </g>
    <text x="140" y="411" font-size="22" font-weight="700">After completion</text>
    <text x="394" y="393" font-size="21">Run it again only after the previous run</text>
    <text x="394" y="425" font-size="21">finishes successfully</text>

    <rect x="82" y="515" width="40" height="40" rx="10" fill="#E1F3EC"/>
    <path d="M102 523L113 527V536C113 544 108 550 102 553C96 550 91 544 91 536V527Z" fill="none" stroke="#20765E" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M97 537H107M102 532V542" stroke="#20765E" stroke-width="2.3" stroke-linecap="round"/>
    <text x="140" y="543" font-size="23" font-weight="700">Watchdog</text>
    <text x="394" y="511" font-size="21">Prepare another attempt before starting important</text>
    <text x="394" y="543" font-size="21">work, so a failed attempt does not silently stop</text>
    <text x="394" y="575" font-size="21">the schedule</text>
  </g>
</svg>
