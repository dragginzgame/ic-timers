<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="title desc">
  <title id="title">How IC Timers helps</title>
  <desc id="desc">Cleanup jobs, queue workers, maintenance and app retries feed into IC Timers. IC Timers connects to the Internet Computer timer system and provides one shared status view.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#009DBD"/></marker>
    <marker id="status-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7354C6"/></marker>
  </defs>
  <rect width="1400" height="750" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · OVERVIEW</text>
    <text x="56" y="107" font-size="34" font-weight="700">How IC Timers helps</text>
    <text x="56" y="143" font-size="19" fill="#53718F">Different jobs. One shared scheduling tool.</text>

    <rect x="56" y="182" width="1288" height="512" rx="22" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <text x="88" y="231" font-size="13" font-weight="700" letter-spacing="1.5" fill="#71859A">APPLICATION TASKS</text>
    <g fill="#EDF3F9" stroke="#B8CBDF" stroke-width="1.5">
      <rect x="88" y="260" width="270" height="64" rx="12"/>
      <rect x="88" y="356" width="270" height="64" rx="12"/>
      <rect x="88" y="452" width="270" height="64" rx="12"/>
      <rect x="88" y="548" width="270" height="64" rx="12"/>
    </g>
    <g font-size="21" font-weight="600">
      <text x="112" y="300">Cleanup jobs</text>
      <text x="112" y="396">Queue workers</text>
      <text x="112" y="492">Maintenance</text>
      <text x="112" y="588">App retries</text>
    </g>
    <path d="M360 292H423V580H360M360 388H423M360 484H423" fill="none" stroke="#71859A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="423" cy="436" r="5" fill="#009DBD"/>
    <path d="M430 436H514" fill="none" stroke="#009DBD" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="530" y="366" width="290" height="140" rx="18" fill="#102B50"/>
    <g transform="translate(553 401)" fill="none" stroke="#5CD7EA" stroke-width="3" stroke-linecap="round">
      <circle cx="33" cy="33" r="27"/>
      <path d="M33 16V33L46 42M33 6V12M60 33H54M33 60V54M6 33H12"/>
    </g>
    <text x="635" y="445" font-size="28" font-weight="700" fill="white">IC Timers</text>

    <path d="M822 436H864V339H914" fill="none" stroke="#009DBD" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M864 436V567H914" fill="none" stroke="#7354C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#status-arrow)"/>
    <circle cx="864" cy="436" r="5" fill="#53718F"/>

    <rect x="930" y="275" width="374" height="128" rx="18" fill="#F0FBFD" stroke="#009DBD" stroke-width="2"/>
    <g transform="translate(953 306)" fill="none" stroke="#087C94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="30" cy="27" r="23"/>
      <path d="M30 12V27L41 34M30 4V9M53 27H48M30 50V45M7 27H12"/>
    </g>
    <text x="1026" y="331" font-size="22" font-weight="700">Internet Computer</text>
    <text x="1026" y="362" font-size="22" font-weight="700">timer system</text>

    <rect x="930" y="503" width="374" height="128" rx="18" fill="#F5F1FD" stroke="#7354C6" stroke-width="2"/>
    <g transform="translate(953 534)" fill="none" stroke="#7354C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="54" height="44" rx="6"/>
      <path d="M3 16H57M16 26H25M16 36H40M21 57H39M30 48V57"/>
    </g>
    <text x="1026" y="559" font-size="22" font-weight="700">One shared</text>
    <text x="1026" y="590" font-size="22" font-weight="700">status view</text>
  </g>
</svg>
