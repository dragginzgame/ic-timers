<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
  <title id="title">IC Timers upgrade lifecycle</title>
  <desc id="desc">Durable application state. The canister starts or upgrades. Reconstruct the required timers. Resume background work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
  </defs>
  <rect width="1200" height="890" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · UPGRADE LIFECYCLE</text>
    <text x="56" y="107" font-size="34" font-weight="700">Reconstruct timers. Resume work.</text>
    <text x="56" y="143" font-size="19" fill="#53718F">A simple view of the application lifecycle.</text>

    <rect x="216" y="188" width="768" height="112" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <rect x="244" y="216" width="56" height="56" rx="13" fill="#DDF6FA"/>
    <g transform="translate(254 225)" fill="none" stroke="#087C94" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="18" cy="7" rx="15" ry="6"/>
      <path d="M3 7V30C3 38 33 38 33 30V7M3 18C3 26 33 26 33 18"/>
    </g>
    <text x="324" y="253" font-size="26" font-weight="700">Durable application state</text>

    <path d="M600 303V348" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="216" y="362" width="768" height="112" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <rect x="244" y="390" width="56" height="56" rx="13" fill="#EDF3F9"/>
    <g transform="translate(254 400)" fill="none" stroke="#53718F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="32" height="32" rx="6"/>
      <path d="M18 27V10M11 17L18 10L25 17"/>
    </g>
    <text x="324" y="427" font-size="26" font-weight="700">Canister starts or upgrades</text>

    <path d="M600 477V522" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="216" y="536" width="768" height="112" rx="18" fill="#F5F1FD" stroke="#7354C6" stroke-width="2"/>
    <rect x="244" y="564" width="56" height="56" rx="13" fill="#EEE8FB"/>
    <g transform="translate(254 574)" fill="none" stroke="#7354C6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="15"/>
      <path d="M18 9V18L26 23M4 5V12H11"/>
    </g>
    <text x="324" y="601" font-size="26" font-weight="700">Reconstruct required timers</text>

    <path d="M600 651V696" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="216" y="710" width="768" height="112" rx="18" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
    <rect x="244" y="738" width="56" height="56" rx="13" fill="#E1F3EC"/>
    <path d="M265 752L283 766L265 780Z" fill="#20765E"/>
    <text x="324" y="775" font-size="26" font-weight="700" fill="#20765E">Resume background work</text>
  </g>
</svg>
