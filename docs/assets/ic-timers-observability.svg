<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
  <title id="title">IC Timers: truthful observability overview</title>
  <desc id="desc">Timer activity is observed by IC Timers. Observations include current state, runs and outcomes, instruction use, memory growth, and registration identity. These feed into one read-only operational snapshot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#009DBD"/></marker>
  </defs>
  <rect width="1280" height="1030" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · OBSERVABILITY</text>
    <text x="56" y="107" font-size="34" font-weight="700">One view of timer activity</text>
    <text x="56" y="143" font-size="19" fill="#53718F">State, outcomes, resource observations and registration identity.</text>

    <rect x="340" y="182" width="600" height="78" rx="16" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <text x="640" y="230" text-anchor="middle" font-size="25" font-weight="700">Timer activity</text>
    <path d="M640 263V296" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="100" y="312" width="1080" height="472" rx="22" fill="#F0FBFD" stroke="#009DBD" stroke-width="2"/>
    <rect x="340" y="336" width="600" height="76" rx="16" fill="#102B50"/>
    <text x="640" y="383" text-anchor="middle" font-size="26" font-weight="700" fill="white">IC Timers observes</text>

    <path d="M640 413V434H258V727" fill="none" stroke="#009DBD" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M258 467H354M258 532H354M258 597H354M258 662H354M258 727H354" fill="none" stroke="#009DBD" stroke-width="2.5" marker-end="url(#cyan-arrow)"/>
    <g fill="#009DBD">
      <circle cx="258" cy="467" r="4"/><circle cx="258" cy="532" r="4"/><circle cx="258" cy="597" r="4"/><circle cx="258" cy="662" r="4"/>
    </g>
    <g fill="white" stroke="#A2DCE5" stroke-width="1.5">
      <rect x="370" y="440" width="628" height="54" rx="11"/>
      <rect x="370" y="505" width="628" height="54" rx="11"/>
      <rect x="370" y="570" width="628" height="54" rx="11"/>
      <rect x="370" y="635" width="628" height="54" rx="11"/>
      <rect x="370" y="700" width="628" height="54" rx="11"/>
    </g>
    <g fill="#087C94">
      <circle cx="400" cy="467" r="4"/><circle cx="400" cy="532" r="4"/><circle cx="400" cy="597" r="4"/><circle cx="400" cy="662" r="4"/><circle cx="400" cy="727" r="4"/>
    </g>
    <g font-size="22" font-weight="600">
      <text x="422" y="475">Current state</text>
      <text x="422" y="540">Runs and outcomes</text>
      <text x="422" y="605">Instruction use</text>
      <text x="422" y="670">Memory growth</text>
      <text x="422" y="735">Registration identity</text>
    </g>

    <path d="M640 787V834" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="192" y="850" width="896" height="126" rx="18" fill="#F5F1FD" stroke="#7354C6" stroke-width="2"/>
    <g transform="translate(224 881)" fill="none" stroke="#7354C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="58" height="44" rx="6"/>
      <path d="M0 12H58M13 23H25M13 33H43M20 55H38M29 44V55"/>
    </g>
    <text x="314" y="902" font-size="26" font-weight="700">One operational snapshot</text>
    <rect x="314" y="922" width="134" height="30" rx="15" fill="#EEE8FB"/>
    <text x="381" y="943" text-anchor="middle" font-size="16" font-weight="700" fill="#7354C6">READ-ONLY</text>
  </g>
</svg>
