<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">IC Timers: three scheduling policy timelines</title>
  <desc id="desc">Once: schedule, run, stop. AfterCompletion: schedule, run, finish successfully, then schedule the next run. Watchdog: schedule the next attempt before running work. A retry path leads back to scheduling the next attempt.</desc>
  <defs>
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#009DBD"/></marker>
    <marker id="violet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7354C6"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#218B70"/></marker>
  </defs>
  <rect width="1400" height="940" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TIMERS · POLICY TIMELINES</text>
    <text x="56" y="107" font-size="34" font-weight="700">When is the next run scheduled?</text>
    <text x="56" y="143" font-size="19" fill="#53718F">The order of events is what makes these policies different.</text>

    <rect x="56" y="182" width="1288" height="178" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <rect x="82" y="208" width="84" height="33" rx="16.5" fill="#DDF6FA"/>
    <text x="124" y="231" font-size="18" font-weight="700" text-anchor="middle" fill="#087C94">Once</text>
    <text x="82" y="335" font-size="16" fill="#53718F">One run, then stop.</text>
    <g fill="#F0FBFD" stroke="#009DBD" stroke-width="1.5">
      <rect x="318" y="247" width="210" height="62" rx="12"/>
      <rect x="797" y="247" width="160" height="62" rx="12"/>
      <rect x="1096" y="247" width="172" height="62" rx="12"/>
    </g>
    <g font-size="21" font-weight="600" text-anchor="middle">
      <text x="423" y="286">Schedule</text>
      <text x="877" y="286">Run</text>
      <text x="1182" y="286">Stop</text>
    </g>
    <path d="M540 278H781M969 278H1080" fill="none" stroke="#009DBD" stroke-width="2.5" marker-end="url(#cyan-arrow)"/>

    <rect x="56" y="384" width="1288" height="212" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <rect x="82" y="410" width="220" height="33" rx="16.5" fill="#EEE8FB"/>
    <text x="192" y="433" font-size="18" font-weight="700" text-anchor="middle" fill="#7354C6">After completion</text>
    <text x="82" y="569" font-size="16" fill="#53718F">Schedule again only after a successful finish.</text>
    <g fill="#F5F1FD" stroke="#7354C6" stroke-width="1.5">
      <rect x="318" y="470" width="170" height="72" rx="12"/>
      <rect x="550" y="470" width="130" height="72" rx="12"/>
      <rect x="742" y="470" width="212" height="72" rx="12"/>
      <rect x="1016" y="470" width="252" height="72" rx="12"/>
    </g>
    <g font-size="20" font-weight="600" text-anchor="middle">
      <text x="403" y="514">Schedule</text>
      <text x="615" y="514">Run</text>
      <text x="848" y="499">Finish</text>
      <text x="848" y="525">successfully</text>
      <text x="1142" y="499">Schedule</text>
      <text x="1142" y="525">next run</text>
    </g>
    <path d="M500 506H534M692 506H726M966 506H1000" fill="none" stroke="#7354C6" stroke-width="2.5" marker-end="url(#violet-arrow)"/>

    <rect x="56" y="620" width="1288" height="264" rx="18" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>
    <rect x="82" y="646" width="128" height="33" rx="16.5" fill="#E1F3EC"/>
    <text x="146" y="669" font-size="18" font-weight="700" text-anchor="middle" fill="#20765E">Watchdog</text>
    <text x="82" y="857" font-size="16" fill="#53718F">The next attempt is prepared before the work starts.</text>
    <g fill="#EAF7F1" stroke="#218B70" stroke-width="1.5">
      <rect x="400" y="704" width="310" height="72" rx="12"/>
      <rect x="950" y="704" width="256" height="72" rx="12"/>
    </g>
    <g font-size="21" font-weight="600" text-anchor="middle">
      <text x="555" y="733">Schedule</text>
      <text x="555" y="760">next attempt</text>
      <text x="1078" y="748">Run work</text>
    </g>
    <path d="M722 740H934" fill="none" stroke="#218B70" stroke-width="2.5" marker-end="url(#green-arrow)"/>
    <path d="M1078 777V810H555V790" fill="none" stroke="#218B70" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
    <rect x="748" y="794" width="140" height="32" rx="16" fill="white"/>
    <text x="818" y="816" font-size="17" font-weight="600" text-anchor="middle" fill="#20765E">Retry path</text>
  </g>
</svg>
