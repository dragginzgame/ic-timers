[package]
name = "ic-timers-size-probe"
rust-version.workspace = true
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["baseline"]
baseline = []
once = []
after-completion = []
watchdog = []

[dependencies]
# Platform 0.1.8 has no CDK macro facade; ic-platform#1 tracks retirement.
# CDK entrypoint macros generate ::candid calls even with wire DTOs in the protocol crate.
candid.workspace = true
ic-cdk.workspace = true
ic-timers.workspace = true
ic-timers-test-protocol.workspace = true

[lints.rust]
unsafe_code = "forbid"
